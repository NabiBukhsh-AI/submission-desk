# Render blueprint: one web service from the Dockerfile.
#
# In Render: New → Blueprint → this repository. The free plan runs it with the
# caveat that its filesystem is wiped on every deploy and the service sleeps
# after fifteen minutes idle: the database, uploaded documents and the saved
# model key start over each time (the sample candidates are re-created at
# start). For data that survives, move to a paid plan and uncomment the disk
# below; the paths already point at it.
#
# APP_SECRET is generated once by Render and kept, which is what makes a saved
# model key readable after a restart.

services:
  - type: web
    name: submission-desk
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_SECRET
        generateValue: true
      # The account, the reviewer and the model key from the environment, so
      # nothing has to be re-entered after a deploy wipes the free tier's
      # disk. `sync: false` values are typed into the Render dashboard once,
      # never into this file.
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: REVIEWER_ID
        value: admin
      - key: MODEL_PROVIDER
        value: anthropic
      - key: MODEL_API_KEY
        sync: false
      - key: MODEL_CHEAP_ID
        value: claude-haiku-4-5
      - key: MODEL_STRONG_ID
        value: claude-haiku-4-5
      - key: DATABASE_PATH
        value: /var/data/db/submission_desk.sqlite
      - key: BLOB_DIR
        value: /var/data/blobs
      - key: LOG_DIR
        value: /var/data/logs
      - key: BLIND_MODE
        value: "true"
      # The integrations. Leave every one of these unset and the service reads
      # its inbox, writes a CSV and logs notifications. To switch them on, add
      # the values in the dashboard (Environment): the four ids and tokens as
      # environment variables, the Google key as a Secret File at the path
      # below. PUBLIC_URL is the link in each Slack message; RENDER_EXTERNAL_URL,
      # which Render sets itself, is used when it is absent.
      #
      # - key: SOURCE_ADAPTER
      #   value: drive
      # - key: GOOGLE_APPLICATION_CREDENTIALS
      #   value: /etc/secrets/service-account.json
      # - key: DRIVE_FOLDER_ID
      #   sync: false
      # - key: SHEETS_SPREADSHEET_ID
      #   sync: false
      # - key: SLACK_BOT_TOKEN
      #   sync: false
      # - key: SLACK_CHANNEL
      #   sync: false
      # - key: PUBLIC_URL
      #   value: https://submission-desk.onrender.com
    # Paid plans only. Uncomment for a database that survives deploys.
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
