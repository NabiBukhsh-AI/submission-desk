# Which model each tier binds to.
#
# This file is the only place a provider model identifier appears. Everywhere
# else — code, logs, chart labels, reports, this comment — says TIER_CHEAP and
# TIER_STRONG, so swapping a model is an edit here and nothing else changes.
#
# That indirection is not tidiness. The routing experiment compares three
# configurations of the same system; if a model name were written into the
# reporting, the comparison would need rewriting every time a binding changed,
# and the numbers would stop being comparable across runs.
#
# Leave these empty to run against the fake provider, which replays recorded
# fixtures and needs no account. That is the default, and it is what `make demo`
# and the whole test suite use.

tiers:
  tier_cheap:
    # Provider model identifier. Read from MODEL_CHEAP_ID when unset here, so a
    # deployment can bind models without editing a committed file.
    model: ""
    # A ceiling, not a budget: structured answers stop when the JSON is
    # complete, and real usage is what the ledger counts. Set high enough that
    # a dense CV's profile is never cut mid-string.
    max_output_tokens: 8192
    # Per chunk while streaming, so a long answer is not a slow one.
    timeout_s: 120

  tier_strong:
    model: ""
    max_output_tokens: 8192
    timeout_s: 180

  # Embeddings for the calibration index. A separate binding because an
  # embedding model is not a chat model and sharing the field would invite
  # someone to set one to the other.
  embedding:
    model: ""
    dimensions: 0
