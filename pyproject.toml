[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "submission-desk"
version = "0.1.0"
description = "Evidence-first candidate screening and submission-package system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Runtime dependencies are deliberately minimal at this phase. Every addition
# needs a justification in the change description and must not duplicate
# something the standard library does adequately.
dependencies = [
    "pydantic>=2.7,<3",
    # Rubrics, prompts, and configuration are YAML because a recruiter edits
    # them. The stdlib has no YAML reader.
    "pyyaml>=6.0",
    # PDF text and geometry. Chosen over pdfplumber for per-block bounding
    # boxes, which the column heuristic needs.
    "pymupdf>=1.24",
    # DOCX paragraphs, runs, and tables. The stdlib can open the zip but not
    # read the document model.
    "python-docx>=1.1",
    # Language detection over page samples. Small, offline, no model download.
    "langdetect>=1.0.9",
    # Cosine similarity over a few hundred calibration vectors. No vector
    # database and no approximate-nearest-neighbour library: a recruiter's
    # history is hundreds of decisions, and an index that needs its own process
    # to answer a millisecond question is a dependency bought with nothing.
    "numpy>=1.26",
    # Structured logging as a processor chain. The redactor has to run before
    # any sink is reached, and a chain makes that an ordering fact rather than a
    # convention every future log call has to remember.
    "structlog>=24.1",
    # The reviewer interface. Chosen because the deliverable is a working
    # workflow rather than a front end: a recruiter needs a queue, a review
    # page, and three buttons, and building that in a JavaScript framework
    # would spend the sprint on something nobody is assessing.
    "streamlit>=1.37",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    # The three rule-engine properties are claims about all inputs, so they are
    # generated rather than enumerated.
    "hypothesis>=6.100",
    "types-PyYAML",
    # Optional: the OCR bridge. Tesseract itself is a system binary, so the
    # adapter degrades to a recorded failure when it is absent rather than
    # pretending a scan was read.
    "pytesseract>=0.3.10",
    "pillow>=10.0",
]

[tool.setuptools.packages.find]
include = [
    "domain*",
    "application*",
    "pipeline*",
    "infrastructure*",
    "app*",
    "eval*",
]

# ---------------------------------------------------------------------------
# Lint and format
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "PL",   # pylint subset
    "RUF",
]

ignore = [
    # UP042 prefers StrEnum. The engineering standards mandate (str, Enum), and
    # the two differ in what str() returns, which changes what lands in logs and
    # in SQLite. The standard wins over the linter's default.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert-heavy, longer-bodied functions.
"tests/**" = ["PLR2004", "PLC0415", "PLR0913", "PLR0917"]
# content_key and the event append take many arguments on purpose: every one is
# keyword-only, and collapsing them into a dict would remove the type checking
# that stops two similar strings being transposed.
"domain/identity.py" = ["PLR0913"]
# The OCR bridge is imported inside the call because Tesseract is a system
# binary that may not be installed. Importing at module load would make a
# missing optional dependency break every document, including the ones that
# need no OCR at all.
"infrastructure/extraction/ocr.py" = ["PLC0415"]
# RUF001/2/3 flag characters that look like other characters. Handling exactly
# those characters is what these modules are for: the curly quote, the en dash
# and the zero-width space are the subject matter, not a typo.
"domain/provenance/normalization.py" = ["RUF001", "RUF002", "RUF003"]
"domain/provenance/ocr_confusions.py" = ["RUF001", "RUF002", "RUF003"]
"tests/unit/test_normalization_profile.py" = ["RUF001", "RUF002", "RUF003"]
"tests/unit/test_span_validator.py" = ["RUF001", "RUF002", "RUF003"]
"tests/unit/test_span_validator_ocr.py" = ["RUF001", "RUF002", "RUF003"]
"tests/property/test_offset_map.py" = ["RUF001", "RUF002", "RUF003"]
# The adversarial corpus and its tests are made of confusable and invisible
# characters. A Cyrillic letter inside a Latin word and a zero-width space
# between two letters are the attacks these files exist to build and detect;
# a linter asking whether they were typed by mistake has the question backwards.
"scripts/make_adversarial_corpus.py" = ["RUF001", "RUF002", "RUF003", "PLE2502"]
"infrastructure/security/detectors.py" = ["RUF001", "RUF002", "RUF003", "PLE2502"]
"tests/adversarial/**" = ["RUF001", "RUF002", "RUF003", "PLE2502"]
# The interface is built of typographic characters on purpose: an en dash in a
# page range and an information icon in a banner are what a person reads, and
# replacing them with ASCII would make the pages worse to look at.
"app/**" = ["RUF001", "RUF002", "RUF003"]
# The evaluation writes arithmetic for a person to check: an en dash in an
# interval and a minus sign in a worked kappa are what the notation is, and
# replacing them with hyphens would make the working harder to follow.
"eval/**" = ["RUF001", "RUF002", "RUF003"]
"tests/eval/**" = ["RUF001", "RUF002", "RUF003"]
# submit_review takes nine arguments because a decision has nine parts, every
# one keyword-only. Collapsing them into a dict would remove the type checking
# that stops a trust rating being passed as an elapsed time.
"application/use_cases/submit_review.py" = ["PLR0913"]
# record_call takes what a call consumed: nine keyword-only parts, each typed.
# A dict would remove the checking that stops a latency being passed as a token
# count, which is precisely the mistake that would corrupt a cost report.
"application/accounting.py" = ["PLR0913"]
# card_from takes the eight things a calibration anchor is made of, each
# keyword-only and typed. A dict would remove the checking that stops a rubric
# version being passed as a role id, which would file every card under the
# wrong role and look like it worked.
"domain/calibration.py" = ["PLR0913"]
# measure_arm takes the six things that define an arm of the experiment, each
# keyword-only. Collapsing them would remove the checking that stops blind mode
# being passed where the noise floor goes, which would silently produce an arm
# measured against itself.
"eval/fairness/runner.py" = ["PLR0913"]
# The redactor returns early per kind of value. Seven short returns read better
# than one nested expression, and each one is a documented rule.
"infrastructure/observability/redactor.py" = ["PLR0911"]
"domain/ports/repositories.py" = ["PLR0913"]
"infrastructure/storage/sqlite/repositories.py" = ["PLR0913"]
# The routed policy has one return per trigger, which is the table it
# implements. Collapsing them would hide the order the triggers are evaluated
# in, and that order is the design.
"infrastructure/models/routing/policies.py" = ["PLR0911"]
# The assess node passes the same five things through its call chain plus a
# keyword-only tier. Bundling them into an object would add a type whose only
# purpose is to satisfy a count.
"pipeline/assess.py" = ["PLR0913", "PLR0917"]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
files = ["domain", "application", "pipeline", "infrastructure", "app", "eval", "tests"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

# Strict mode applies to the two layers that hold the business rules. The rest
# of the tree is checked in standard mode, because adapter code deals with
# untyped third-party surfaces where strictness buys assertions rather than
# safety.
[[tool.mypy.overrides]]
module = ["domain.*", "application.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
no_implicit_reexport = true
strict_equality = true
warn_return_any = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root on sys.path, so the layer packages import without an
# editable install being a precondition for running the suite.
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "live: touches a real external service; excluded from the offline suite",
    "slow: takes more than a second; excluded from the default check",
]
