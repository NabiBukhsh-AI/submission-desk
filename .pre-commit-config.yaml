# Every hook here has a counterpart in `make check`, so the hooks are a
# convenience and CI is the gate. On Windows the interpreter lives under
# .venv/Scripts/; the paths below assume a POSIX layout, which is what CI and
# the container use. Run `make check` directly on Windows.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: detect-private-key

  # Local hooks. Each runs through the project's own interpreter so the hook
  # and `make check` see the same code. `language: system` means pre-commit
  # does not build its own environment for them, which is the point: a hook
  # that checked a different install would be checking something else.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: .venv/bin/mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: schemas-current
        name: committed JSON Schema matches the models
        entry: .venv/bin/python scripts/export_schemas.py --check
        language: system
        pass_filenames: false
        files: ^domain/contracts/
      # The two scanners also run in CI through `make check`, so a commit made
      # with hooks disabled is still caught before it merges. Both take the
      # staged filenames from pre-commit and fall back to the whole tree when
      # run by hand.
      - id: check-pii
        name: no candidate contact details in the commit
        entry: .venv/bin/python scripts/check_pii.py
        language: system
      - id: check-secrets
        name: no credentials and no .env in the commit
        entry: .venv/bin/python scripts/check_secrets.py
        language: system
